server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: lseg-ingest
  main:
    web-application-type: servlet
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lseg}
    user: ${DB_OWNER_USER:owner}
    password: ${DB_OWNER_PASSWORD:ownerpw}

ingest:
  inputDir: ${INGEST_DIR:/data}
  archiveDir: ${ARCHIVE_DIR:/archive}
  charset: ${INGEST_CHARSET:UTF-8}
  skipPatterns:
    - "*.note.txt.zip"
    - "Reference-INT-EQUI-*"
  ricCaretFilter: true
  auditLookbackDays: 60           # load audit records within this window for idempotency checks
  maxBusinessDateAgeDays: 30      # reject jobs with business date older than this
  threads:
    intPerTable: 5
    deltaTargetsParallel: 3
    pricing-threads: 3
  batch:
    upsertSize: 2000
    deleteSize: 2000
  cancel:
    checkRows: 5000              # poll stop signal every N rows inside a file
  reaper:
    enabled: true
    staleJobTimeoutSeconds: 10800   # reap RUNNING jobs whose heartbeat is older than 3h
    pollIntervalSeconds: 60
  cluster:
    lockName: ${CLUSTER_LOCK_NAME:lseg-ingest-cluster}
    heartbeatIntervalSeconds: 30
  retry:
    maxAttempts: 10
    initialDelayMs: 500
    maxDelayMs: 10000

db:
  runtime:
    url: jdbc:mariadb://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:lseg}?rewriteBatchedStatements=true&useServerPrepStmts=false&cachePrepStmts=true&useLocalSessionState=true
    user: ${DB_USER:ingest}
    password: ${DB_PASSWORD:ingestpw}
    pool:
      maxSize: 50
      minIdle: 10
      connectionTimeoutMs: 30000

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [job=%X{jobId:-} file=%X{file:-}] %logger{36} - %msg%n"
  level:
    root: INFO
    com.lseg.ingest: INFO

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    metrics:
      enabled: true
